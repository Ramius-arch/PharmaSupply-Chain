# Netlify Configuration for PharmaSupply Blockchain Frontend

[build]
  publish = "frontend/dist"
  command = "npm install && npm run build --workspace=frontend"

[build.environment]
  NODE_VERSION = "18"

# Proxy API requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://pharmasupply-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Catch-all redirect for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

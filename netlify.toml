# Netlify Configuration for PharmaSupply Blockchain Frontend

[build]
  base = "frontend"
  publish = "frontend/dist"
  command = "cd frontend && npm install && npm run build"

# Proxy API requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://pharmasupply-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Catch-all redirect for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
